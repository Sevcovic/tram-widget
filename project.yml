# Tram Widget — generate the Xcode project with `xcodegen generate`.
#
# Building it yourself? Change the two lines marked ▶ to your own values:
#   DEVELOPMENT_TEAM: your Apple team ID (Xcode → Settings → Accounts)
#   BUNDLE_PREFIX:    any reverse-domain you own, e.g. com.yourname
name: TramWidget
options:
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    DEVELOPMENT_TEAM: M4UR3N7X2Y            # ▶
    BUNDLE_PREFIX: com.petrsevcovic         # ▶
    APP_GROUP_ID: $(TeamIdentifierPrefix)tramwidget
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    GENERATE_INFOPLIST_FILE: YES
targets:
  TramWidget:
    type: application
    platform: macOS
    sources: [App, Shared]
    entitlements:
      path: App/App.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Tram Widget
        LSApplicationCategoryType: public.app-category.travel
        AppGroupID: $(APP_GROUP_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).tramwidget
        PRODUCT_NAME: TramWidget
    dependencies:
      - target: TramWidgetExtension
  TramWidgetExtension:
    type: app-extension
    platform: macOS
    sources: [Widget, Shared]
    entitlements:
      path: Widget/Widget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Tram Widget
        AppGroupID: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).tramwidget.widget
